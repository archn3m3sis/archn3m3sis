name: Generate contribution-grid snake

# Runs daily (and on manual dispatch) — feeds the public contribution
# grid for archn3m3sis through Platane/snk, which emits an animated SVG
# of a snake eating the contribution cells. Pushes both light and dark
# variants to the `output` branch so the README `<picture>` element
# can pick the right one based on the visitor's color-scheme preference.

on:
  schedule:
    - cron: "13 */6 * * *"  # every 6 hours, offset to dodge the top-of-hour pile-up
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: archn3m3sis
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
